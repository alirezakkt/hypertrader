<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HyperTrader — Find Real Profitable Traders on Hyperliquid</title>
<meta name="description" content="Discover real profitable traders on Hyperliquid. Filter by consistency, drawdown, and edge. Copy-trade on testnet or mainnet." />
<script src="/vendor/tailwind.js"></script>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/babel.js"></script>
<style>
  * { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  body { background: #050811; color: #e2e8f0; }
  .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(12px); }
  .glass-hover:hover { background: rgba(255,255,255,0.06); border-color: rgba(59,130,246,0.3); }
  .gradient-text { background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .glow { box-shadow: 0 0 40px rgba(59,130,246,0.15); }
  .row:hover { background: rgba(59,130,246,0.06); }
  .badge { font-size: 11px; padding: 2px 10px; border-radius: 9999px; font-weight: 500; }
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }
  .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .pulse-dot { animation: pulse-dot 2s infinite; }
  .sticky-header th { position: sticky; top: 0; background: #0a0f1e; z-index: 10; }
  .tooltip { position: relative; }
  .tooltip:hover .tooltip-text { opacity: 1; pointer-events: auto; }
  .tooltip-text { opacity: 0; pointer-events: none; transition: opacity 0.2s; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; z-index: 50; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return '-';
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (a >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (a >= 1e3) return (n/1e3).toFixed(2)+'K';
  return Number(n).toFixed(2);
};
const fmtPct = (n) => (n===null||n===undefined||isNaN(n))?'-': (n>=0?'+':'')+Number(n).toFixed(2)+'%';
const shortAddr = (a) => a ? a.slice(0,6)+'…'+a.slice(-4) : '-';

function ScoreBadge({ score }) {
  const color = score >= 120 ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : score >= 80 ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-slate-500/20 text-slate-300 border-slate-500/30';
  return <span className={`badge border ${color}`}>{score}</span>;
}
function StyleBadge({ style }) {
  const colors = { directional:'bg-emerald-500/20 text-emerald-300 border-emerald-500/30', swing:'bg-blue-500/20 text-blue-300 border-blue-500/30', scalper:'bg-amber-500/20 text-amber-300 border-amber-500/30', hft:'bg-red-500/20 text-red-300 border-red-500/30', market_maker:'bg-purple-500/20 text-purple-300 border-purple-500/30', mixed:'bg-slate-500/20 text-slate-300 border-slate-500/30' };
  return <span className={`badge border ${colors[style]||'bg-slate-500/20 text-slate-300 border-slate-500/30'}`}>{style||'?'}</span>;
}
function Stat({ label, value, color, small }) {
  const c = color==='emerald'?'text-emerald-400': color==='red'?'text-red-400': color==='amber'?'text-amber-400':'text-white';
  return (
    <div className="glass rounded-xl p-3 hover:border-blue-500/20 transition-colors">
      <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1">{label}</div>
      <div className={`${small?'text-sm':'text-xl'} font-bold ${c}`}>{value}</div>
    </div>
  );
}
function EquityChart({ data }) {
  if (!data || data.length < 2) return null;
  const w = 700, h = 140;
  const vals = data.map(d=>d.v||d.cash||0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const pts = data.map((d,i) => {
    const x = (i/(data.length-1))*w;
    const y = h - ((vals[i]-min)/range)*(h-16) - 8;
    return `${x},${y}`;
  }).join(' ');
  const last = vals[vals.length-1];
  const first = vals[0];
  const color = last >= first ? '#34d399' : '#f87171';
  const areaPts = `0,${h} ${pts} ${w},${h}`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-32 rounded-lg">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={areaPts} fill="url(#areaGrad)" />
      <polyline fill="none" stroke={color} strokeWidth="2" points={pts} />
      <circle cx={(data.length-1)/(data.length-1)*w} cy={h - ((last-min)/range)*(h-16) - 8} r="4" fill={color} />
    </svg>
  );
}

// ===== Leaderboard View =====
function LeaderboardView() {
  const [filters, setFilters] = useState({ window: 'month', sortBy: 'score', minPnl: 0, minVolume: 10000, minAccount: 1000, minWins: 2, minRoi: 0, onlyReal: true, limit: 50 });
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [selected, setSelected] = useState(null);
  const [detail, setDetail] = useState(null);
  const [detailLoading, setDetailLoading] = useState(false);

  const load = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const q = new URLSearchParams({ window: filters.window, sortBy: filters.sortBy, minPnl: filters.minPnl, minVolume: filters.minVolume, minAccount: filters.minAccount, minWins: filters.minWins, minRoi: filters.minRoi / 100, onlyReal: filters.onlyReal, limit: filters.limit });
      const r = await fetch('/api/leaderboard?' + q.toString());
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      setData(j);
    } catch (e) { setError(e.message); }
    setLoading(false);
  }, [filters]);
  useEffect(() => { load(); }, [load]);

  const openTrader = async (t) => {
    setSelected(t); setDetail(null); setDetailLoading(true);
    try { const r = await fetch('/api/trader/' + t.ethAddress); setDetail(await r.json()); }
    catch (e) { setDetail({ error: e.message }); }
    setDetailLoading(false);
  };

  const traders = data?.traders || [];
  return (
    <div className="fade-in">
      <div className="flex flex-col lg:flex-row gap-4">
        <aside className="lg:w-64 shrink-0 space-y-3">
          <div className="glass rounded-xl p-4 space-y-3">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Filters</div>
            <div>
              <label className="text-xs text-slate-500">Window</label>
              <select className="w-full mt-1 bg-slate-800/80 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500/50" value={filters.window} onChange={e=>setFilters(f=>({...f,window:e.target.value}))}>
                <option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="allTime">All Time</option>
              </select>
            </div>
            <div>
              <label className="text-xs text-slate-500">Sort by</label>
              <select className="w-full mt-1 bg-slate-800/80 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500/50" value={filters.sortBy} onChange={e=>setFilters(f=>({...f,sortBy:e.target.value}))}>
                <option value="score">Real Profit Score</option><option value="pnl">PnL</option><option value="roi">ROI</option><option value="volume">Volume</option><option value="account">Account Value</option>
              </select>
            </div>
            {[
              ['minPnl','Min PnL (window)'],['minVolume','Min Volume (all-time)'],['minAccount','Min Account Value'],
              ['minWins','Min Profitable Windows'],['minRoi','Min ROI % (window)'],['limit','Limit'],
            ].map(([k,label])=>(
              <div key={k}>
                <label className="text-xs text-slate-500">{label}</label>
                <input type="number" className="w-full mt-1 bg-slate-800/80 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500/50" value={filters[k]} onChange={e=>setFilters(f=>({...f,[k]:Number(e.target.value)}))} />
              </div>
            ))}
            <label className="flex items-center gap-2 text-sm cursor-pointer select-none">
              <input type="checkbox" className="rounded" checked={filters.onlyReal} onChange={e=>setFilters(f=>({...f,onlyReal:e.target.checked}))} />
              <span className="text-slate-300">Real-profit filter</span>
            </label>
            <button onClick={load} className="w-full bg-gradient-to-r from-blue-600 to-violet-600 hover:from-blue-500 hover:to-violet-500 rounded-lg py-2.5 text-sm font-semibold transition-all glow">
              {loading ? 'Loading...' : 'Apply Filters'}
            </button>
            {error && <div className="text-xs text-red-400 bg-red-500/10 rounded-lg p-2">{error}</div>}
            <div className="text-xs text-slate-500 text-center">{data ? `${data.total} qualifying traders` : ''}</div>
          </div>
        </aside>

        <main className="flex-1 min-w-0">
          <div className="glass rounded-xl overflow-hidden">
            <div className="overflow-x-auto scrollbar">
              <table className="w-full text-sm">
                <thead className="sticky-header">
                  <tr className="text-left text-xs text-slate-500 border-b border-white/10">
                    <th className="py-3 px-3">#</th>
                    <th className="py-3 px-3">Trader</th>
                    <th className="py-3 px-3">Score</th>
                    <th className="py-3 px-3">Style</th>
                    <th className="py-3 px-3">PnL</th>
                    <th className="py-3 px-3">ROI</th>
                    <th className="py-3 px-3">Account</th>
                    <th className="py-3 px-3">Volume</th>
                    <th className="py-3 px-3">Wins</th>
                  </tr>
                </thead>
                <tbody>
                  {loading && traders.length===0 && Array.from({length:8}).map((_,i)=>(
                    <tr key={i} className="border-b border-white/5">
                      {Array.from({length:9}).map((_,j)=>(<td key={j} className="py-3 px-3"><div className="h-4 bg-slate-700/50 rounded animate-pulse"></div></td>))}
                    </tr>
                  ))}
                  {traders.map((t,i)=>(
                    <tr key={t.ethAddress} className="row border-b border-white/5 cursor-pointer transition-colors" onClick={()=>openTrader(t)}>
                      <td className="py-3 px-3 text-slate-600 font-mono text-xs">{i+1}</td>
                      <td className="py-3 px-3">
                        <div className="mono text-xs text-blue-300">{shortAddr(t.ethAddress)}</div>
                        {t.displayName && <div className="text-xs text-slate-500 mt-0.5">{t.displayName}</div>}
                      </td>
                      <td className="py-3 px-3"><ScoreBadge score={t.score} /></td>
                      <td className="py-3 px-3"><StyleBadge style={t.style} /></td>
                      <td className={`py-3 px-3 font-semibold ${t.pnl[filters.window]>=0?'text-emerald-400':'text-red-400'}`}>{fmt(t.pnl[filters.window])}</td>
                      <td className={`py-3 px-3 ${t.roi[filters.window]>=0?'text-emerald-400':'text-red-400'}`}>{fmtPct(100 * t.roi[filters.window])}</td>
                      <td className="py-3 px-3 text-slate-300">{fmt(t.accountValue)}</td>
                      <td className="py-3 px-3 text-slate-400">{fmt(t.vlm.allTime)}</td>
                      <td className="py-3 px-3"><span className="text-xs">{t.wins}/4</span></td>
                    </tr>
                  ))}
                  {traders.length===0 && !loading && (
                    <tr><td colSpan="9" className="py-12 text-center text-slate-500">No traders match filters. Try relaxing filters.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>

      {selected && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in" onClick={()=>setSelected(null)}>
          <div className="glass rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 scrollbar" onClick={e=>e.stopPropagation()}>
            <div className="flex items-start justify-between mb-6">
              <div>
                <h2 className="mono text-sm text-blue-300">{selected.ethAddress}</h2>
                {selected.displayName && <div className="text-xs text-slate-400 mt-1">{selected.displayName}</div>}
                <div className="mt-2"><StyleBadge style={detail?.metrics?.style || selected.style} /></div>
              </div>
              <button onClick={()=>setSelected(null)} className="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <Stat label="Score" value={selected.score} />
              <Stat label="Account" value={fmt(selected.accountValue)} />
              <Stat label="PnL (month)" value={fmt(selected.pnl.month)} color={selected.pnl.month>=0?'emerald':'red'} />
              <Stat label="ROI (month)" value={fmtPct(selected.roi.month)} color={selected.roi.month>=0?'emerald':'red'} />
            </div>
            <h3 className="text-sm font-semibold text-slate-300 mb-3">Window Performance</h3>
            <div className="glass rounded-xl overflow-hidden mb-6">
              <table className="w-full text-xs">
                <thead><tr className="text-slate-500 border-b border-white/10"><th className="text-left py-2 px-3">Window</th><th className="py-2 px-3">PnL</th><th className="py-2 px-3">ROI</th><th className="py-2 px-3">Volume</th></tr></thead>
                <tbody>
                  {['day','week','month','allTime'].map(k=>(
                    <tr key={k} className="border-t border-white/5">
                      <td className="py-2 px-3 capitalize text-slate-400">{k}</td>
                      <td className={`py-2 px-3 font-medium ${selected.pnl[k]>=0?'text-emerald-400':'text-red-400'}`}>{fmt(selected.pnl[k])}</td>
                      <td className={`py-2 px-3 ${selected.roi[k]>=0?'text-emerald-400':'text-red-400'}`}>{fmtPct(100 * selected.roi[k])}</td>
                      <td className="py-2 px-3 text-slate-400">{fmt(selected.vlm[k])}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {detailLoading && <div className="text-sm text-slate-400 text-center py-4">Loading on-chain details...</div>}
            {detail && !detail.error && (
              <>
                <h3 className="text-sm font-semibold text-slate-300 mb-3">Open Positions</h3>
                {detail.positions && detail.positions.length ? (
                  <div className="glass rounded-xl overflow-hidden mb-6">
                    <table className="w-full text-xs">
                      <thead><tr className="text-slate-500 border-b border-white/10"><th className="text-left py-2 px-3">Coin</th><th className="py-2 px-3">Size</th><th className="py-2 px-3">Entry</th><th className="py-2 px-3">uPnL</th><th className="py-2 px-3">Leverage</th></tr></thead>
                      <tbody>
                        {detail.positions.map((p,i)=>(
                          <tr key={i} className="border-t border-white/5">
                            <td className="py-2 px-3 font-medium">{p.coin}</td>
                            <td className={`py-2 px-3 mono ${parseFloat(p.szi)>=0?'text-emerald-400':'text-red-400'}`}>{p.szi}</td>
                            <td className="py-2 px-3 text-slate-400">{p.entryPx}</td>
                            <td className={`py-2 px-3 font-medium ${parseFloat(p.unrealizedPnl)>=0?'text-emerald-400':'text-red-400'}`}>{fmt(p.unrealizedPnl)}</td>
                            <td className="py-2 px-3 text-slate-400">{p.leverage?.value || p.leverage}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : <div className="text-xs text-slate-500 mb-6 glass rounded-xl p-4 text-center">No open positions</div>}

                {detail.metrics && (
                  <>
                    <h3 className="text-sm font-semibold text-slate-300 mb-3">Fill Metrics (last {detail.fillsCount})</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                      <Stat label="Style" value={detail.metrics.style} small />
                      <Stat label="Trades" value={detail.metrics.trades} small />
                      <Stat label="Win Rate" value={detail.metrics.winRate+'%'} small color={detail.metrics.winRate>=50?'emerald':'red'} />
                      <Stat label="Profit Factor" value={detail.metrics.profitFactor} small color={detail.metrics.profitFactor>=1.5?'emerald':'red'} />
                      <Stat label="Total PnL" value={fmt(detail.metrics.totalPnl)} small color={detail.metrics.totalPnl>=0?'emerald':'red'} />
                      <Stat label="Net PnL" value={fmt(detail.metrics.netPnl)} small color={detail.metrics.netPnl>=0?'emerald':'red'} />
                      <Stat label="Max Drawdown" value={fmt(detail.metrics.maxDrawdown)} small color="red" />
                      <Stat label="Max DD %" value={detail.metrics.maxDrawdownPct+'%'} small color="red" />
                    </div>
                    {detail.metrics.equityCurve && detail.metrics.equityCurve.length > 1 && (
                      <div className="mb-6">
                        <h3 className="text-sm font-semibold text-slate-300 mb-3">Equity Curve (net of fees)</h3>
                        <div className="glass rounded-xl p-3"><EquityChart data={detail.metrics.equityCurve.map(e=>({v:e.v,t:e.t}))} /></div>
                      </div>
                    )}
                  </>
                )}

                {detail.metrics && detail.metrics.coins && Object.keys(detail.metrics.coins).length > 0 && (
                  <>
                    <h3 className="text-sm font-semibold text-slate-300 mb-3">Performance by Coin</h3>
                    <div className="glass rounded-xl overflow-hidden">
                      <table className="w-full text-xs">
                        <thead><tr className="text-slate-500 border-b border-white/10"><th className="text-left py-2 px-3">Coin</th><th className="py-2 px-3">Trades</th><th className="py-2 px-3">PnL</th><th className="py-2 px-3">Volume</th></tr></thead>
                        <tbody>
                          {Object.entries(detail.metrics.coins).sort((a,b)=>b[1].pnl-a[1].pnl).map(([c,v])=>(
                            <tr key={c} className="border-t border-white/5">
                              <td className="py-2 px-3 font-medium">{c}</td>
                              <td className="py-2 px-3 text-slate-400">{v.trades}</td>
                              <td className={`py-2 px-3 font-medium ${v.pnl>=0?'text-emerald-400':'text-red-400'}`}>{fmt(v.pnl)}</td>
                              <td className="py-2 px-3 text-slate-400">{fmt(v.volume)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </>
            )}
            {detail && detail.error && <div className="text-red-400 text-sm glass rounded-xl p-4">{detail.error}</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// ===== Live View =====
function LiveView() {
  const [addrs, setAddrs] = useState('');
  const [mirrorReady, setMirrorReady] = useState(false);
  const [finding, setFinding] = useState(false);
  const [walletMessage, setWalletMessage] = useState('');
  const [events, setEvents] = useState([]);
  const [connected, setConnected] = useState(false);
  const [mirrorRunning, setMirrorRunning] = useState(false);
  const [scale, setScale] = useState('0.001');
  const [agentKey, setAgentKey] = useState('');
  const [account, setAccount] = useState('');
  const [testnet, setTestnet] = useState(true);
  const esRef = useRef(null);

  const connect = () => {
    const list = addrs.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if (!list.length) return;

    if (esRef.current) esRef.current.close();
    const es = new EventSource('/api/live?addresses=' + encodeURIComponent(list.join(',')));
    esRef.current = es;
    es.onopen = () => setConnected(true);
    es.onmessage = (e) => { try { setEvents(prev => [{ t: Date.now(), d: JSON.parse(e.data) }, ...prev].slice(0, 100)); } catch(_) { setEvents(prev => [{ t: Date.now(), raw: e.data }, ...prev].slice(0, 100)); } };
    es.addEventListener('status', () => setConnected(true));
    es.onerror = () => setConnected(false);
  };
  const disconnect = () => { if (esRef.current) esRef.current.close(); esRef.current = null; setConnected(false); };
  useEffect(() => () => { if (esRef.current) esRef.current.close(); }, []);

  useEffect(() => {
    const controller = new AbortController();
    fetch('/api/recommended', { signal: controller.signal }).then(r => r.json()).then(cfg => {
      if (cfg.replay?.network === (testnet ? 'testnet' : 'mainnet') && cfg.scale === Number(scale) && Date.now() - cfg.updatedAt < 86400000) {
        setAddrs(value => value || cfg.wallets.join('\n'));
      }
    }).catch(() => {});
    return () => controller.abort();
  }, []);
  const scanInputs = JSON.stringify([scale, account, testnet, addrs]);
  const latestInputs = useRef(scanInputs);
  latestInputs.current = scanInputs;
  const findWallets = async () => {
    setFinding(true);
    setWalletMessage('Checking recent fill history…');
    try {
      const r = await fetch('/api/recommended/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scale, testnet, account }) });
      const result = await r.json();
      if (!r.ok) throw new Error(result.error);
      if (latestInputs.current !== scanInputs) {
        setWalletMessage('Scan settings or wallet list changed. Run Find wallets to use the current settings.');
        return;
      }
      setAddrs(result.wallets.join('\n'));
      setWalletMessage(result.wallets.length + ' qualified out of ' + result.checked + ' wallets checked. ' + result.replay.network + ' · $' + fmt(result.replay.initialEquity) + (result.replay.reference ? ' reference balance.' : ' account equity.') + (result.unavailable ? ' History unavailable for ' + result.unavailable + '.' : ''));
    } catch (e) { setWalletMessage(e.message); }
    finally { setFinding(false); }
  };
  const startMirror = async () => {
    const tracked = [...new Set(addrs.toLowerCase().split(/[,\s]+/).filter(Boolean))];
    const r = await fetch('/api/mirror/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ addresses: tracked, scale, agentKey, account, testnet }) });
    const j = await r.json();
    if (j.ok) setMirrorRunning(true);
    alert(j.ok ? 'Mirror started (pid '+j.pid+')' : (j.msg||'failed'));
  };
  const stopMirror = async () => { await fetch('/api/mirror/stop', { method:'POST' }); setMirrorRunning(false); };
  useEffect(() => {
    const refresh = () => fetch('/api/mirror/status').then(r=>r.json()).then(j=>{ setMirrorRunning(j.running); setMirrorReady(j.ready); }).catch(()=>{});
    refresh();
    const timer = setInterval(refresh, 3000);
    return () => clearInterval(timer);
  }, []);

  const renderFill = (f) => {
    if (!f) return null;
    const d = f.d?.data || {};
    const fills = d.fills || (Array.isArray(d) ? d : []);
    if (fills.length === 0) return null;
    return fills.map((fill,i) => (
      <div key={i} className="flex items-center justify-between py-2 px-3 border-b border-white/5 last:border-0">
        <div>
          <span className={`font-semibold ${fill.side==='B'?'text-emerald-400':'text-red-400'}`}>{fill.side==='B'?'BUY':'SELL'}</span>
          <span className="text-slate-300 ml-2">{fill.coin}</span>
          <span className="text-slate-500 ml-2 text-xs">{fill.dir}</span>
        </div>
        <div className="text-right">
          <div className="mono text-xs">{fmt(fill.sz)} @ {fmt(fill.px)}</div>
          {fill.closedPnl && <div className={`text-xs ${parseFloat(fill.closedPnl)>=0?'text-emerald-400':'text-red-400'}`}>PnL: {fmt(fill.closedPnl)}</div>}
        </div>
      </div>
    ));
  };

  return (
    <div className="p-4 space-y-4 fade-in">
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="glass rounded-xl p-5">
          <h2 className="font-semibold text-lg mb-1">Live Trade Tracker</h2>
          <p className="text-xs text-slate-500 mb-4">Paste trader addresses to stream their fills in real-time via WebSocket.</p>
          <button type="button" disabled={finding} onClick={findWallets} className="mb-2 rounded-lg bg-slate-700 px-3 py-2 text-sm disabled:opacity-50">Find wallets</button>
          <div role="status" className="mb-2 text-xs text-slate-400">{walletMessage}</div>
          <textarea aria-label="Mainnet wallets to track or copy" className="w-full bg-slate-800/50 border border-white/10 rounded-lg p-3 text-xs mono h-28 focus:outline-none focus:border-blue-500/50" value={addrs} onChange={e=>setAddrs(e.target.value)} placeholder="0xabc...\n0xdef..." />
          <div className="flex gap-2 mt-3">
            <button onClick={connect} className="bg-emerald-600 hover:bg-emerald-500 rounded-lg px-5 py-2 text-sm font-medium transition-colors">Connect</button>
            <button onClick={disconnect} className="bg-slate-700 hover:bg-slate-600 rounded-lg px-5 py-2 text-sm font-medium transition-colors">Disconnect</button>
            <span className={`text-xs self-center flex items-center gap-1.5 ${connected?'text-emerald-400':'text-slate-500'}`}>
              <span className={`w-2 h-2 rounded-full ${connected?'bg-emerald-400 pulse-dot':'bg-slate-600'}`}></span>
              {connected?'Live':'Offline'}
            </span>
          </div>
        </div>

        <div className="glass rounded-xl p-5">
          <h2 className="font-semibold text-lg mb-1">Copy-Trade on Testnet/Mainnet</h2>
          <p className="text-xs text-slate-500 mb-4">Copy new mainnet perpetual fills from the listed wallets. Testnet mode sends orders to your testnet account.</p>
          <div className="space-y-3">
            <div className="flex items-center gap-2">
              <label className="text-xs text-slate-500 w-24">Size scale</label>
              <input className="flex-1 bg-slate-800/50 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500/50" value={scale} onChange={e=>setScale(e.target.value)} />
            </div>
            <div>
              <label className="text-xs text-slate-500">Agent key (private)</label>
              <input type="password" className="w-full mt-1 bg-slate-800/50 border border-white/10 rounded-lg px-3 py-2 text-xs mono focus:outline-none focus:border-blue-500/50" value={agentKey} onChange={e=>setAgentKey(e.target.value)} placeholder="0x..." />
            </div>
            <div>
              <label className="text-xs text-slate-500">Account address</label>
              <input className="w-full mt-1 bg-slate-800/50 border border-white/10 rounded-lg px-3 py-2 text-xs mono focus:outline-none focus:border-blue-500/50" value={account} onChange={e=>setAccount(e.target.value)} placeholder="0x..." />
            </div>
            <label className="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" className="rounded" checked={testnet} onChange={e=>setTestnet(e.target.checked)} />
              <span className="text-slate-300">Testnet mode</span>
            </label>
            <div className="flex gap-2">
              <button onClick={startMirror} disabled={mirrorRunning} className="flex-1 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 rounded-lg px-4 py-2 text-sm font-medium transition-colors">Start Mirror</button>
              <button onClick={stopMirror} disabled={!mirrorRunning} className="flex-1 bg-red-600 hover:bg-red-500 disabled:opacity-40 rounded-lg px-4 py-2 text-sm font-medium transition-colors">Stop Mirror</button>
            </div>
            <div className={`text-xs text-center ${mirrorRunning?'text-emerald-400':'text-slate-500'}`}>{mirrorRunning?(mirrorReady?'● Mirroring active':'Connecting to wallets…'):'○ Stopped'}</div>
          </div>
        </div>
      </div>

      <div className="glass rounded-xl p-5">
        <h2 className="font-semibold text-lg mb-3">Live Feed <span className="text-slate-500 text-sm font-normal">({events.length})</span></h2>
        <div className="max-h-[50vh] overflow-y-auto scrollbar space-y-1">
          {events.map((e,i)=>(
            <div key={i} className="glass-hover rounded-lg p-3 transition-colors">
              <div className="text-[10px] text-slate-600 mb-1">{new Date(e.t).toLocaleTimeString()}</div>
              {renderFill(e)}
            </div>
          ))}
          {events.length===0 && <div className="text-slate-500 text-sm text-center py-8">No events yet. Connect to start streaming.</div>}
        </div>
      </div>
    </div>
  );
}

// ===== Simulation View =====
function SimView() {
  const [addrs, setAddrs] = useState('');
  const [tracked, setTracked] = useState([]);
  const [status, setStatus] = useState(null);
  const [running, setRunning] = useState(false);
  const pollRef = useRef(null);

  const refresh = async () => { try { const r = await fetch('/api/sim/status'); setStatus(await r.json()); } catch(e){} };
  useEffect(() => { refresh(); pollRef.current = setInterval(refresh, 3000); return () => clearInterval(pollRef.current); }, []);

  const start = async () => {
    const list = addrs.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if (!list.length) return;
    setTracked(list);
    await fetch('/api/sim/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ addresses: list, scale: 0.001 }) });
    setRunning(true); refresh();
  };
  const stop = async () => { await fetch('/api/sim/stop', { method:'POST' }); setRunning(false); refresh(); };
  const reset = async () => { await fetch('/api/sim/reset', { method:'POST' }); refresh(); };

  const positions = status?.positions || {};
  const trades = status?.trades || [];
  const eq = status?.equityHistory || [];
  const m = status?.metrics || {};

  return (
    <div className="p-4 space-y-4 fade-in">
      <div className="glass rounded-xl p-5">
        <h2 className="font-semibold text-lg mb-1">Paper Trading Simulator</h2>
        <p className="text-xs text-slate-500 mb-4">Mirrors trades into a simulated $10,000 account with real fees, slippage, funding & liquidation. No real funds.</p>
        <textarea className="w-full bg-slate-800/50 border border-white/10 rounded-lg p-3 text-xs mono h-20 focus:outline-none focus:border-blue-500/50" value={addrs} onChange={e=>setAddrs(e.target.value)} placeholder="Paste trader addresses (one per line)" />
        <div className="flex gap-2 mt-3">
          <button onClick={start} className="bg-emerald-600 hover:bg-emerald-500 rounded-lg px-5 py-2 text-sm font-medium transition-colors">Start</button>
          <button onClick={stop} className="bg-red-600 hover:bg-red-500 rounded-lg px-5 py-2 text-sm font-medium transition-colors">Stop</button>
          <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 rounded-lg px-5 py-2 text-sm font-medium transition-colors">Reset</button>
          <span className={`text-xs self-center flex items-center gap-1.5 ${status?.running?'text-emerald-400':'text-slate-500'}`}>
            <span className={`w-2 h-2 rounded-full ${status?.running?'bg-emerald-400 pulse-dot':'bg-slate-600'}`}></span>
            {status?.running?'Running':'Stopped'}
          </span>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="Cash" value={fmt(status?.cash)} />
        <Stat label="Equity" value={fmt(status?.equity)} color={status?.equity>=10000?'emerald':'red'} />
        <Stat label="Unrealized" value={fmt(status?.unrealized)} color={status?.unrealized>=0?'emerald':'red'} />
        <Stat label="Total Trades" value={m.trades ?? trades.length} />
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="Win Rate" value={(m.winRate??0)+'%'} color={m.winRate>=50?'emerald':'red'} />
        <Stat label="Profit Factor" value={m.profitFactor??0} color={m.profitFactor>=1.5?'emerald':'red'} />
        <Stat label="Max Drawdown" value={fmt(m.maxDrawdown)} color="red" />
        <Stat label="Sharpe Ratio" value={m.sharpe??0} color={m.sharpe>=1?'emerald':'red'} />
        <Stat label="Gross Win" value={fmt(m.grossWin)} color="emerald" />
        <Stat label="Gross Loss" value={fmt(m.grossLoss)} color="red" />
        <Stat label="Net PnL" value={fmt(m.netPnl)} color={m.netPnl>=0?'emerald':'red'} />
        <Stat label="Closes" value={m.closes??0} />
      </div>

      {eq.length > 1 && (
        <div className="glass rounded-xl p-5">
          <h2 className="font-semibold text-lg mb-3">Equity Curve</h2>
          <EquityChart data={eq.map(e=>({v:e.cash||0,t:e.t}))} />
        </div>
      )}

      <div className="glass rounded-xl p-5">
        <h2 className="font-semibold text-lg mb-3">Open Positions</h2>
        {Object.keys(positions).length ? (
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead><tr className="text-slate-500 border-b border-white/10"><th className="text-left py-2 px-3">Coin</th><th className="py-2 px-3">Size</th><th className="py-2 px-3">Entry</th><th className="py-2 px-3">Mid</th><th className="py-2 px-3">uPnL</th></tr></thead>
              <tbody>
                {Object.entries(positions).map(([c,p])=> {
                  const mid = parseFloat(status?.mids?.[c]||p.entry);
                  const upnl = (mid - p.entry)*p.size;
                  return (
                    <tr key={c} className="border-t border-white/5">
                      <td className="py-2 px-3 font-medium">{c}</td>
                      <td className={`py-2 px-3 mono ${p.size>=0?'text-emerald-400':'text-red-400'}`}>{Number(p.size).toFixed(4)}</td>
                      <td className="py-2 px-3 text-slate-400">{Number(p.entry).toFixed(4)}</td>
                      <td className="py-2 px-3 text-slate-400">{mid.toFixed(4)}</td>
                      <td className={`py-2 px-3 font-medium ${upnl>=0?'text-emerald-400':'text-red-400'}`}>{fmt(upnl)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : <div className="text-slate-500 text-sm text-center py-6">No open positions</div>}
      </div>

      <div className="glass rounded-xl p-5">
        <h2 className="font-semibold text-lg mb-3">Trade Log <span className="text-slate-500 text-sm font-normal">(last {trades.length} of {m.trades ?? trades.length})</span></h2>
        <div className="max-h-[40vh] overflow-y-auto scrollbar space-y-1">
          {trades.map((t,i)=>(
            <div key={i} className="bg-slate-800/40 hover:bg-slate-800/60 rounded-lg p-3 text-xs transition-colors">
              <div className="flex items-center justify-between mb-1">
                <span className="text-slate-500 mono">{new Date(t.t).toLocaleTimeString()}</span>
                <span className={`font-semibold ${t.type==='open'?'text-blue-400':t.type==='close'?(t.pnl>=0?'text-emerald-400':'text-red-400'):'text-amber-400'}`}>{t.type.toUpperCase()}</span>
              </div>
              <div className="flex items-center justify-between">
                <span>{t.coin} {t.side} {Number(t.sz).toFixed(4)} @ {Number(t.px).toFixed(4)}</span>
                {t.pnl !== undefined && <span className={`font-medium ${t.pnl>=0?'text-emerald-400':'text-red-400'}`}>{t.pnl>=0?'+':''}{fmt(t.pnl)}</span>}
              </div>
              {t.fee > 0 && <div className="text-[10px] text-slate-600 mt-0.5">Fee: {fmt(t.fee)}</div>}
            </div>
          ))}
          {trades.length===0 && <div className="text-slate-500 text-sm text-center py-6">No trades yet. Start the simulator.</div>}
        </div>
      </div>
    </div>
  );
}

// ===== App =====
function App() {
  const [view, setView] = useState('leaderboard');
  return (
    <div className="min-h-screen">
      <header className="border-b border-white/5 px-6 py-4 flex items-center justify-between sticky top-0 bg-[#050811]/80 backdrop-blur-xl z-40">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center font-bold text-white text-sm">H</div>
          <div>
            <h1 className="text-lg font-bold tracking-tight gradient-text">HyperTrader</h1>
            <p className="text-[10px] text-slate-500 -mt-0.5">Find real profitable traders on Hyperliquid</p>
          </div>
        </div>
        <nav className="flex gap-1 bg-slate-800/50 rounded-lg p-1">
          {[['leaderboard','Leaderboard'],['live','Live & Mirror'],['sim','Simulation']].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${view===v?'bg-blue-600 text-white shadow-lg shadow-blue-600/25':'text-slate-400 hover:text-white'}`}>{l}</button>
          ))}
        </nav>
      </header>
      <main className="max-w-[1400px] mx-auto px-4 py-6">
        {view==='leaderboard' ? <LeaderboardView /> : view==='live' ? <LiveView /> : <SimView />}
      </main>
      <footer className="border-t border-white/5 px-6 py-4 text-center text-xs text-slate-600">
        <p>HyperTrader — Find real profitable traders on Hyperliquid. Open source. <a href="https://github.com/alirezakkt/hypertrader" className="text-blue-400 hover:underline">GitHub</a></p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
